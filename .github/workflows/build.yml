# Kjører testene ved hver push. På main bygges også et native image med GraalVM.
# Det testes mot en tom database og rulles ut til Cloud Run hvis Google Cloud er satt opp.
name: Bygg og test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Tester
        run: bash ./mvnw -B verify

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    env:
      REGION: europe-west2
      IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT || 'lokalt' }}/stromsmart-api/stromsmart-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Native image
        run: docker build -t "$IMAGE" .
      - name: Test bildet
        run: bash sky/test-bilde.sh "$IMAGE"

      # Resten kjører bare når Google Cloud er satt opp.
      - uses: google-github-actions/auth@v2
        if: vars.GCP_PROJECT != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: vars.GCP_PROJECT != ''
      - name: Last opp bildet
        if: vars.GCP_PROJECT != ''
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"
      - name: Cloud Run
        if: vars.GCP_PROJECT != ''
        # Bare en instans, og den stoppes når ingen bruker tjenesten.
        # CORS_ORIGINS er nettsidene som får bruke API-et, skilt med komma.
        run: |
          gcloud run deploy stromsmart-api --image "$IMAGE" --region "$REGION" --quiet \
            --service-account "stromsmart-run@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com" \
            --allow-unauthenticated --min-instances 0 --max-instances 1 \
            --cpu 1 --memory 512Mi --cpu-boost --timeout 300 \
            --set-env-vars "^@^SPRING_PROFILES_ACTIVE=cloud@STROMSMART_CORS_ALLOWED_ORIGINS=${{ vars.CORS_ORIGINS || 'http://127.0.0.1:8138' }}" \
            --set-secrets "SPRING_DATASOURCE_URL=db-url:latest,FLYWAY_URL=flyway-url:latest,SPRING_DATASOURCE_USERNAME=db-user:latest,SPRING_DATASOURCE_PASSWORD=db-password:latest,STROMSMART_IMPORT_TOKEN=import-token:latest"
      - name: Sjekk at tjenesten svarer
        if: vars.GCP_PROJECT != ''
        run: |
          url=$(gcloud run services describe stromsmart-api --region "$REGION" --format 'value(status.url)')
          curl -fsS -m 30 "$url/actuator/health"
          curl -fsS -m 30 "$url/api/v1/areas" > /dev/null
          echo "Kjører på $url"
      - name: Hent priser med en gang
        if: vars.GCP_PROJECT != ''
        # Ellers er databasen tom til Cloud Scheduler kjører neste gang, opptil en halvtime senere.
        continue-on-error: true
        run: gcloud scheduler jobs run hent-priser --location "$REGION"
